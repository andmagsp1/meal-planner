name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify installation
        run: |
          echo "Checking node_modules/.bin/biome:"
          ls -la node_modules/.bin/biome || echo "biome symlink not found"
          echo "Checking @biomejs/biome package:"
          ls -la node_modules/@biomejs/biome/bin/biome || echo "biome binary not found"

      - name: Run Biome check
        run: npm run check

      - name: Run tests
        run: npm run test -- --run

      - name: Build project
        run: npm run build --if-present

